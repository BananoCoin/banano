# Bootstrap Performance Optimization Settings
# Increase number of outbound bootstrap connections (must be power of 2)
bootstrap_connections = 16
# Increase max inbound bootstrap connections
bootstrap_connections_max = 128
# Increase threads for concurrent bootstrap attempts
bootstrap_initiator_threads = 4
# Increase threads serving bootstrap data to other peers
bootstrap_serving_threads = 4
# Increase bootstrap bandwidth limit (50 MB/s instead of default 5 MB/s)
bootstrap_bandwidth_limit = 52428800

[node.bootstrap]
# Enable all bootstrap strategies
enable = true
enable_priorities = true
enable_database_scan = false
enable_dependency_walker = true
enable_frontier_scan = true

# Increase rate limits for faster bootstrapping
channel_limit = 64
rate_limit = 4000
database_rate_limit = 2000
frontier_rate_limit = 64
max_requests = 4096

# Reduce throttle wait time
throttle_wait = 50

# Optimize block processor threshold
block_processor_threshold = 2000

[node.bootstrap.account_sets]
# Increase priorities max for better performance
priorities_max = 524288
blocking_max = 524288
# Reduce cooldown for faster processing
cooldown = 1000

[node.bootstrap.frontier_scan]
# Increase parallelism for frontier scanning
head_parallelism = 256
consideration_count = 8
candidates = 2000
cooldown = 2000
max_pending = 32

[node.bootstrap_server]
# Enable bootstrap server
enable = true
# Increase queue size
max_queue = 32
# Increase threads for serving bootstrap requests
threads = 4
# Increase batch size
batch_size = 128
# Increase rate limit for serving (0 = unlimited, but use high value)
limiter = 2000

[node.websocket]

# WebSocket server bind address.
# type:string,ip
address = "::ffff:0.0.0.0"
# Enable or disable WebSocket server.
# type:bool
enable = true

[rpc]

# Enable or disable RPC.
# type:bool
enable = true
